[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
gas_limit = "3000000000"
remappings = [
    # OpenZeppelin resolves DIRECTLY — the core contracts must compile without v4-periphery.
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    # Uniswap v4 is only needed by the hook/adapter tests.
    "v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "forge-std/=lib/forge-std/src/",
    "test/=lib/v4-periphery/test/",
]
fs_permissions = [{ access = "read", path = "out" }]
via_ir = true

